name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-macos:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: LightMD-macos-arm64
            asset_suffix: arm64
          - os: macos-15
            target: x86_64-apple-darwin
            artifact_name: LightMD-macos-x64
            asset_suffix: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show tool versions
        run: |
          node -v
          npm -v
          rustc -V
          cargo -V

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Prepare macOS SDK env (x64 cross target)
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun --sdk macosx --show-sdk-platform-version)" >> "$GITHUB_ENV"

      - name: Build Tauri bundles
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      - name: Rename release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          DMG_SOURCE="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)"
          APP_SOURCE="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)"
          cp "$DMG_SOURCE" "release-assets/LightMD-${VERSION}-macos-${{ matrix.asset_suffix }}.dmg"
          cp "$APP_SOURCE" "release-assets/LightMD-${VERSION}-macos-${{ matrix.asset_suffix }}.app.tar.gz"

      - name: Upload release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LightMD ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
